# Example input.yaml for joint E/F/stress + BEC training with SevenNet-LES.
#
# Two train streams:
#   load_trainset_path -> E/F/stress-only frames (large batches)
#   load_becset_path   -> BEC-labeled frames    (small batches; a BEC training
#                         step costs ~3.8x the memory of an E/F/s step)
# Batches are homogeneous (pure-EFS or pure-BEC) in shuffled order, so BEC
# frames never inflate the memory of EFS batches and shuffling stays on.

model:
    chemical_species: 'univ'
    cutoff: 5.0
    channel: 32
    is_parity: True
    lmax: 2
    num_convolution_layer: 3
    irreps_manual:
        - "32x0e"
        - "32x0e+32x1o+32x2e"
        - "32x0e+32x1o+32x2e"
        - "32x0e"

    weight_nn_hidden_neurons: [64, 64]
    radial_basis:
        radial_basis_name: 'bessel'
        bessel_basis_num: 8
    cutoff_function:
        cutoff_function_name: 'XPLOR'
        cutoff_on: 4.5

    act_gate: {'e': 'silu', 'o': 'tanh'}
    act_scalar: {'e': 'silu', 'o': 'tanh'}

    conv_denominator: 44.91849297426908
    train_shift_scale: False
    train_shift: True
    train_scale: True
    train_denominator: False
    self_connection_type: 'linear'

    use_modal_node_embedding: False
    use_modal_self_inter_intro: False
    use_modal_self_inter_outro: False
    use_modal_output_block: False

    # ----------------------------------------------------------------------
    # LES (Latent Ewald Summation) configuration
    # ----------------------------------------------------------------------
    use_les: True                                 # Master switch: enable the long-range LES branch.
    les_config:
        les_args:
            use_atomwise: False                   # MUST be False.
            sigma: 1.0                            # Default: Gaussian width per atom (Angstrom) for the Ewald split.
            dl: 2.0                               # Default: Reciprocal-space grid resolution (smaller = finer/ more k-points).
            remove_self_interaction: True         # Default: Subtract each charge's self-energy.

        ewald_type: triton                        # Preferred (needs triton + CUDA). | 'batched' (default) | 'flat' | 'auto' | 'cheng'
        n_charges: 1                              # Default: Number of latent charge channels per atom. Increase for richer LR.
        hidden_channels: [16]                     # Default: []. Hidden widths of the charge-readout MLP. [] -> single IrrepsLinear layer.
        zero_init: False                          # Default: MUST be False for real training.

        # Charge neutralization: enforce per-graph total charge = 0 before the Ewald sum.
        neutralize_mode: fukui                    # Default: 'none'. | 'shift' (subtract per-graph mean) | 'fukui' (learned redistribution)
        fukui_hidden_channels: [8]                # 'fukui' only: hidden widths of the Fukui-weight readout MLP. [] -> single IrrepsLinear.
        fukui_zero_init: False

        epsilon_mode: learned_atomic              # Default: 'fixed'. | 'learned' (per-graph eps) | 'learned_atomic' (per-atom eps)
        epsilon_hidden_channels: [16]             # Hidden widths of the epsilon readout MLP. [] -> single IrrepsLinear.
        epsilon_min_one: True                     # Default. True (anti-screening prohibited)
        remove_mean: q_projection                 # BEC re-neutralization. 'uniform' (default) | 'none' | 'q_projection'(only for learned_atomic)

        freeze_sr: False                          # Default: False -> train SR + LES jointly (training from scratch).

train:
    train_shuffle: True
    random_seed: 77777777
    is_train_stress : True
    is_train_bec: True                            # Adds the BEC loss; becset frames supervise it.
    epoch: 1000

    loss:
        energy:
            loss_weight: 1.0
            loss_type: 'mae'
        force:
            loss_weight: 1.0
            loss_type: 'l2mae'
        stress:
            loss_weight: 0.0001
            loss_type: 'l2mae'
        bec:
            loss_weight: 0.1
            loss_type: 'l2mae'

    optimizer: 'adam'
    optim_param:
        lr: 0.02
    scheduler: 'onecyclelr'
    scheduler_param:
        max_lr: 0.02
        epochs: 1000
        pct_start: 0.05
        anneal_strategy: 'cos'
        div_factor: 25.0
        final_div_factor: 10000.0

    error_record:
        - ['Energy', 'MAE']
        - ['Force', 'MAE']
        - ['Stress', 'MAE']
        - ['Energy', 'Loss']
        - ['Force', 'Loss']
        - ['Stress', 'Loss']
        - ['BEC', 'MAE']
        - ['BEC', 'Loss']
        - ['TotalLoss', 'None']

    per_epoch: 1
    train_by_batch: True
    use_modality: False

data:
    batch_size: 64      # EFS batches. per GPU batch size.
    bec_batch_size: 8   # BEC batches. Rule of thumb: ~6 GiB peak per 1000 atoms in a BEC batch.
    shift: -4.532467842102051  # fake
    scale: 1.964433980617986   # fake

    use_modal_wise_shift: True
    use_modal_wise_scale: False

    dataset_type: 'graph'
    load_trainset_path: 'path/to/trainset_without_BEC_labels'
    load_bec_trainset_path: 'path/to/trainset_with_BEC_labels'
    load_validset_path: 'path/to/validset_without_BEC_labels'
    load_bec_validset_path: 'path/to/validset_with_BEC_labels'
